<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dutch Vocabulary Trainer</title>
<style>
  :root{
    --bg:#0f1420; --panel:#171e2e; --panel2:#1e2740; --border:#2a3450;
    --text:#e8ecf4; --muted:#8b96b0; --accent:#5b8cff; --accent2:#7c5bff;
    --good:#3ecf8e; --hard:#f0a94a; --bad:#f06a6a; --easy:#3ecf8e;
    --chip-on:#2c3d6b;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);color:var(--text);min-height:100vh;}
  .wrap{max-width:760px;margin:0 auto;padding:20px 16px 60px;}
  h1{font-size:22px;margin:4px 0 2px;}
  .sub{color:var(--muted);font-size:13px;margin-bottom:18px;}
  .panel{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:14px;}
  .statrow{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;}
  .stat{flex:1;min-width:80px;background:var(--panel);border:1px solid var(--border);border-radius:12px;
    padding:10px 12px;text-align:center;}
  .stat .n{font-size:20px;font-weight:700;}
  .stat .l{font-size:11px;color:var(--muted);margin-top:2px;}
  .section-title{font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;
    margin:0 0 8px;display:flex;align-items:center;justify-content:space-between;}
  .section-title .btns{display:flex;gap:6px;}
  .level-group{margin-bottom:10px;}
  .level-group:last-child{margin-bottom:0;}
  .level-group-title{font-size:12px;color:var(--accent);font-weight:600;margin:6px 0 6px;}
  .chips{display:flex;flex-wrap:wrap;gap:8px;}
  .chip{cursor:pointer;user-select:none;background:var(--panel2);border:1px solid var(--border);
    border-radius:999px;padding:6px 12px;font-size:13px;display:flex;align-items:center;gap:6px;
    transition:background .15s,border-color .15s;}
  .chip:hover{border-color:var(--accent);}
  .chip.on{background:var(--chip-on);border-color:var(--accent);}
  .chip .checkmark{font-size:12px;opacity:.85;}
  .chip .count{color:var(--muted);font-size:11px;}
  .smallbtn{background:var(--panel2);border:1px solid var(--border);color:var(--text);border-radius:8px;
    padding:5px 10px;font-size:12px;cursor:pointer;}
  .smallbtn:hover{border-color:var(--accent);}
  select,input[type=number]{background:var(--panel2);border:1px solid var(--border);color:var(--text);
    border-radius:8px;padding:8px 10px;font-size:14px;}
  .row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:10px;}
  .row label{font-size:13px;color:var(--muted);margin-right:4px;}
  .toggle-row{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text);cursor:pointer;margin-top:4px;}
  .primary{background:linear-gradient(135deg,var(--accent),var(--accent2));border:none;color:#fff;
    font-weight:700;font-size:15px;padding:13px 18px;border-radius:12px;cursor:pointer;width:100%;}
  .primary:disabled{opacity:.4;cursor:not-allowed;}
  .secondary{background:var(--panel2);border:1px solid var(--border);color:var(--text);
    font-weight:600;font-size:14px;padding:11px 16px;border-radius:12px;cursor:pointer;width:100%;margin-top:8px;}
  .warn-banner{background:#3a2a1a;border:1px solid #7a5a2a;color:#f0c98a;border-radius:10px;
    padding:10px 12px;font-size:12.5px;margin-bottom:14px;}
  /* study */
  .study-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-size:13px;color:var(--muted);}
  .progressbar{height:6px;background:var(--panel2);border-radius:4px;overflow:hidden;margin-bottom:18px;}
  .progressbar > div{height:100%;background:var(--accent);transition:width .2s;}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:18px;padding:36px 22px;
    min-height:220px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
    cursor:pointer;}
  .card .tag{font-size:11px;color:var(--muted);margin-bottom:14px;letter-spacing:.03em;text-transform:uppercase;}
  .card .front{font-size:28px;font-weight:700;line-height:1.3;}
  .card .article{color:var(--accent);margin-right:6px;}
  .card .hint{color:var(--muted);font-size:12px;margin-top:16px;}
  .card .back{margin-top:20px;padding-top:20px;border-top:1px solid var(--border);width:100%;}
  .card .back .en{font-size:20px;font-weight:600;color:var(--good);}
  .card .back .forms{font-size:13px;color:var(--muted);margin-top:8px;}
  .gradebtns{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px;margin-top:16px;}
  .gradebtns button{border:none;border-radius:10px;padding:12px 4px;font-size:13px;font-weight:700;color:#0b0f18;cursor:pointer;}
  .gradebtns button.again{background:var(--bad);}
  .gradebtns button.hard{background:var(--hard);}
  .gradebtns button.good{background:var(--good);}
  .gradebtns button.easy{background:#2fe0a8;}
  .exitbar{margin-top:14px;text-align:center;}
  .exitbar a{color:var(--muted);font-size:12px;cursor:pointer;text-decoration:underline;}
  /* browse */
  .browse-search{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--border);
    background:var(--panel2);color:var(--text);font-size:14px;margin-bottom:12px;}
  .wordrow{border-bottom:1px solid var(--border);padding:10px 2px;display:flex;justify-content:space-between;gap:10px;}
  .wordrow:last-child{border-bottom:none;}
  .wordrow .wd{font-weight:600;}
  .wordrow .wd .article{color:var(--accent);}
  .wordrow .we{color:var(--muted);font-size:13px;margin-top:2px;}
  .wordrow .wf{color:var(--muted);font-size:12px;margin-top:2px;font-style:italic;}
  .wordrow .meta{font-size:11px;color:var(--muted);text-align:right;white-space:nowrap;}
  .opt-badge{display:inline-block;background:#3a2a1a;color:#f0c98a;border-radius:6px;padding:1px 6px;
    font-size:10px;margin-left:6px;}
  .backlink{color:var(--muted);font-size:12px;cursor:pointer;text-decoration:underline;margin-bottom:12px;display:inline-block;}
  /* sync */
  .sync-details summary{cursor:pointer;font-size:13px;font-weight:600;color:var(--text);}
  .sync-details{font-size:13px;}
  .sync-body{margin-top:10px;display:flex;flex-direction:column;gap:8px;}
  textarea{width:100%;background:var(--panel2);border:1px solid var(--border);color:var(--text);
    border-radius:8px;padding:8px;font-size:12px;font-family:monospace;min-height:60px;}
  .sync-msg{font-size:12px;min-height:16px;}
  .sync-msg.ok{color:var(--good);}
  .sync-msg.err{color:var(--bad);}
  .empty-state{color:var(--muted);text-align:center;padding:30px 10px;font-size:14px;}
  /* verb drill */
  .verb-card{background:var(--panel);border:1px solid var(--border);border-radius:18px;padding:28px 22px;margin-bottom:14px;}
  .verb-inf{font-size:26px;font-weight:700;text-align:center;}
  .verb-en{color:var(--muted);font-size:14px;text-align:center;margin-top:4px;margin-bottom:22px;}
  .vfield{margin-bottom:16px;}
  .vfield label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.03em;}
  .vfield input[type=text]{width:100%;padding:11px 12px;font-size:16px;border-radius:10px;border:1px solid var(--border);
    background:var(--panel2);color:var(--text);}
  .vfield input[type=text]:disabled{opacity:.85;}
  .auxbtns{display:flex;gap:10px;}
  .auxbtn{flex:1;padding:11px;border-radius:10px;border:1px solid var(--border);background:var(--panel2);
    color:var(--text);font-size:15px;font-weight:600;cursor:pointer;}
  .auxbtn.selected{background:var(--chip-on);border-color:var(--accent);}
  .auxbtn:disabled{cursor:default;}
  .vfield.correct input[type=text]{border-color:var(--good);}
  .vfield.incorrect input[type=text]{border-color:var(--bad);}
  .auxbtn.correct{border-color:var(--good);background:#1c3a2e;}
  .auxbtn.incorrect{border-color:var(--bad);background:#3a1c1c;}
  .answer-hint{font-size:12px;margin-top:5px;}
  .answer-hint.ok{color:var(--good);}
  .answer-hint.bad{color:var(--bad);}
  .verb-score{font-size:13px;color:var(--muted);text-align:center;margin-top:10px;}
</style>
</head>

const CAT_LABELS = { noun:'Noun', verb:'Verb', adjective:'Adjective', adverb:'Adverb',
  irregular_verb:'Irregular verb', separable_verb:'Separable verb',
  preposition_phrase:'Prep. phrase', idiom:'Idiom', pronoun:'Pronoun', conjunction:'Conjunction' };
const LEVEL_LABELS = { 'A1':'A1', 'A2':'A2', 'A2-B1':'A2\u2013B1' };
const LEVEL_ORDER = ['A1','A2','A2-B1'];
const BOX_DAYS = [0, 1, 3, 7, 16, 35, 90];
const STORAGE_KEY = 'dutchVocabSRS_v1';
const PREFS_KEY = 'dutchVocabPrefs_v2';
const DAY_MS = 86400000;

let storageWorks = true;
function safeGet(key){
  try { return localStorage.getItem(key); } catch(e){ storageWorks = false; return null; }
}
function safeSet(key, val){
  try { localStorage.setItem(key, val); return true; } catch(e){ storageWorks = false; return false; }
}

let srs = {};
try {
  const raw = safeGet(STORAGE_KEY);
  if (raw) srs = JSON.parse(raw);
} catch(e) { srs = {}; }

let prefs = { levels: null, chapters: null, categories: null, includeOptional: true, direction: 'mixed', sessionSize: 30 };
try {
  const raw = safeGet(PREFS_KEY);
  if (raw) {
    const p = JSON.parse(raw);
    prefs = Object.assign(prefs, p);
  }
} catch(e) {}

function saveSRS(){ safeSet(STORAGE_KEY, JSON.stringify(srs)); }
function savePrefs(){ safeSet(PREFS_KEY, JSON.stringify(prefs)); }

// Derived indexes
const CHAPTERS_BY_LEVEL = {};
LEVEL_ORDER.forEach(lv => {
  const map = new Map();
  WORDS.filter(w => w.level === lv).forEach(w => { if (!map.has(w.chapter)) map.set(w.chapter, w.chapter_title); });
  CHAPTERS_BY_LEVEL[lv] = [...map.entries()].sort((a,b)=>a[0]-b[0]);
});
const CATEGORIES = Object.keys(CAT_LABELS).filter(c => WORDS.some(w=>w.category===c));
const LEVELS_PRESENT = LEVEL_ORDER.filter(lv => WORDS.some(w=>w.level===lv));

function chapKey(level, num){ return level + '|' + num; }

// ---- SRS helpers ----
function getCard(id){
  if (!srs[id]) srs[id] = { box:0, due:0, reps:0, lapses:0 };
  return srs[id];
}
function isNew(id){ return !srs[id] || srs[id].reps === 0; }
function isDue(id){
  const c = srs[id];
  if (!c || c.reps === 0) return true;
  return c.due <= Date.now();
}
function isMastered(id){
  const c = srs[id];
  return c && c.box >= 5;
}
function isLearning(id){
  const c = srs[id];
  return c && c.reps > 0 && c.box < 5;
}

function filteredWords(){
  return WORDS.filter(w => {
    if (prefs.levels && !prefs.levels.includes(w.level)) return false;
    if (prefs.chapters && !prefs.chapters.includes(chapKey(w.level, w.chapter))) return false;
    if (prefs.categories && !prefs.categories.includes(w.category)) return false;
    if (!prefs.includeOptional && w.optional) return false;
    return true;
  });
}

// ---- Verb conjugation drill (irregular/separable verbs: past simple + perfect tense + hebben/zijn) ----
const VERB_STORAGE_KEY = 'dutchVerbSRS_v1';
const VERB_PREFS_KEY = 'dutchVerbPrefs_v1';

let verbSrs = {};
try {
  const raw = safeGet(VERB_STORAGE_KEY);
  if (raw) verbSrs = JSON.parse(raw);
} catch(e) { verbSrs = {}; }

let verbPrefs = { levels: null, chapters: null, includeOptional: true, sessionSize: 15 };
try {
  const raw = safeGet(VERB_PREFS_KEY);
  if (raw) verbPrefs = Object.assign(verbPrefs, JSON.parse(raw));
} catch(e) {}

function saveVerbSRS(){ safeSet(VERB_STORAGE_KEY, JSON.stringify(verbSrs)); }
function saveVerbPrefs(){ safeSet(VERB_PREFS_KEY, JSON.stringify(verbPrefs)); }

const VERB_LEVELS_PRESENT = LEVEL_ORDER.filter(lv => VERB_DRILL.some(w=>w.level===lv));
const VERB_CHAPTERS_BY_LEVEL = {};
VERB_LEVELS_PRESENT.forEach(lv => {
  const map = new Map();
  VERB_DRILL.filter(w => w.level === lv).forEach(w => { if (!map.has(w.chapter)) map.set(w.chapter, w.chapter_title); });
  VERB_CHAPTERS_BY_LEVEL[lv] = [...map.entries()].sort((a,b)=>a[0]-b[0]);
});

function getVerbCard(id){
  if (!verbSrs[id]) verbSrs[id] = { box:0, due:0, reps:0, lapses:0 };
  return verbSrs[id];
}
function verbIsNew(id){ return !verbSrs[id] || verbSrs[id].reps === 0; }
function verbIsDue(id){
  const c = verbSrs[id];
  if (!c || c.reps === 0) return true;
  return c.due <= Date.now();
}
function verbIsMastered(id){ const c = verbSrs[id]; return c && c.box >= 5; }

function activeVerbLevels(){
  return VERB_LEVELS_PRESENT.filter(lv => !verbPrefs.levels || verbPrefs.levels.includes(lv));
}

function filteredVerbs(){
  return VERB_DRILL.filter(w => {
    if (verbPrefs.levels && !verbPrefs.levels.includes(w.level)) return false;
    if (verbPrefs.chapters && !verbPrefs.chapters.includes(chapKey(w.level, w.chapter))) return false;
    if (!verbPrefs.includeOptional && w.optional) return false;
    return true;
  });
}

function splitAlternatives(s){
  // "wilde/wou" -> ["wilde","wou"]; plain string -> [string]
  return String(s).split('/').map(x=>x.trim()).filter(Boolean);
}
function normalizeAnswer(s){
  return String(s||'').trim().toLowerCase().replace(/\s+/g,' ');
}
function answerMatches(userText, correctText){
  if (!correctText) return false;
  const user = normalizeAnswer(userText);
  const alts = splitAlternatives(correctText).map(normalizeAnswer);
  return alts.includes(user);
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function render(){
  const app = document.getElementById('app');
  if (view === 'home') app.innerHTML = renderHome();

  else if (view === 'summary') app.innerHTML = renderSummary();

  else if (view === 'verbdrill') app.innerHTML = renderVerbDrill();
  else if (view === 'verbsummary') app.innerHTML = renderVerbSummary();

}

  let due = 0, mastered = 0, learning = 0, newCount = 0;
  words.forEach(w => {

    else if (isMastered(w.id)) mastered++;
    else learning++;
    if (isDue(w.id)) due++;
  });

    <div class="stat"><div class="n">${total}</div><div class="l">In selection</div></div>

function pickDirection(){
  if (prefs.direction === 'nl-en') return 'nl-en';
  if (prefs.direction === 'en-nl') return 'en-nl';
  return Math.random() < 0.5 ? 'nl-en' : 'en-nl';
}

function buildQueue(){
  const words = filteredWords();
  const due = words.filter(w => isDue(w.id) && !isNew(w.id));
  const fresh = words.filter(w => isNew(w.id));
  // prioritize due reviews, then new words, shuffle within each group
  shuffle(due); shuffle(fresh);
  const size = Math.max(5, Math.min(200, prefs.sessionSize||30));
  const queue = due.concat(fresh).slice(0, size);
  return queue.map(w => w.id);
}

function shuffle(arr){
  for (let i=arr.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]] = [arr[j],arr[i]];
  }
}

function startSession(){
  const ids = buildQueue();
  if (ids.length === 0) return;
  session = { queue: ids, pos: 0, showBack:false, correct:0, again:0,
    directions: ids.map(pickDirection), total: ids.length };
  view = 'study';
  render();
}

function currentItem(){
  if (!session) return null;
  const id = session.queue[session.pos];
  return WORDS.find(w => w.id === id);
}

function renderStudy(){
  const item = currentItem();
  if (!item){ view='summary'; return renderSummary(); }
  const dir = session.directions[session.pos];
  const showDutchFront = dir === 'nl-en';
  const front = showDutchFront
    ? `${item.article ? `<span class="article">${item.article}</span>` : ''}${escapeHtml(item.dutch)}`
    : escapeHtml(item.english);
  const back = showDutchFront
    ? `<div class="en">${escapeHtml(item.english)}</div>`
    : `<div class="en">${item.article?`<span class="article">${item.article}</span>`:''}${escapeHtml(item.dutch)}</div>`;
  const formsLine = item.forms ? `<div class="forms">${escapeHtml(item.forms)}</div>` : '';
  const pct = Math.round((session.pos/session.total)*100);
  return `
  <div class="study-top">
    <span>${LEVEL_LABELS[item.level]} \u00b7 H${item.chapter}${item.chapter_title? ': '+escapeHtml(item.chapter_title):''}</span>
    <span>${session.pos+1} / ${session.total}</span>
  </div>
  <div class="progressbar"><div style="width:${pct}%"></div></div>
  <div class="card" id="flashcard">
    <div class="tag">${CAT_LABELS[item.category]}${item.optional?' <span class="opt-badge">optional</span>':''}</div>
    <div class="front">${front}</div>
    ${session.showBack ? `<div class="back">${back}${formsLine}</div>` : `<div class="hint">Tap card to reveal</div>`}
  </div>
  ${session.showBack ? `
  <div class="gradebtns">
    <button class="again" data-grade="0">Again</button>
    <button class="hard" data-grade="1">Hard</button>
    <button class="good" data-grade="2">Good</button>
    <button class="easy" data-grade="3">Easy</button>
  </div>` : ''}
  <div class="exitbar"><a id="btnExit">End session</a></div>
  `;
}

function grade(g){
  const item = currentItem();
  if (!item) return;
  const card = getCard(item.id);
  card.reps += 1;
  if (g === 0){ // again
    card.box = 0;
    card.lapses += 1;
    session.again += 1;
  } else if (g === 1){ // hard
    card.box = Math.max(0, card.box - 1);
    session.correct += 1;
  } else if (g === 2){ // good
    card.box = Math.min(BOX_DAYS.length-1, card.box + 1);
    session.correct += 1;
  } else { // easy
    card.box = Math.min(BOX_DAYS.length-1, card.box + 2);
    session.correct += 1;
  }
  card.due = Date.now() + BOX_DAYS[card.box]*DAY_MS;
  saveSRS();

  if (g === 0){
    // requeue "again" cards a few positions later in this session
    const insertAt = Math.min(session.queue.length, session.pos + 4);
    session.queue.splice(insertAt, 0, item.id);
    session.directions.splice(insertAt, 0, session.directions[session.pos]);
    session.total = session.queue.length;
  }
  session.pos += 1;
  session.showBack = false;
  if (session.pos >= session.queue.length){ view = 'summary'; }
  render();
}

function pickVerbQueue(){
  const verbs = filteredVerbs();
  const due = verbs.filter(w => verbIsDue(w.id) && !verbIsNew(w.id));
  const fresh = verbs.filter(w => verbIsNew(w.id));
  shuffle(due); shuffle(fresh);
  const size = Math.max(5, Math.min(100, verbPrefs.sessionSize||15));
  return due.concat(fresh).slice(0, size).map(w=>w.id);
}

function startVerbSession(){
  const ids = pickVerbQueue();
  if (ids.length === 0) return;
  verbSession = { queue: ids, pos: 0, total: ids.length, correctCount:0, again:0,
    checked:false, chosenAux:null, result:null, pastDraft:'', partDraft:'' };
  view = 'verbdrill';
  render();
}

function currentVerbItem(){
  if (!verbSession) return null;
  return VERB_DRILL.find(w => w.id === verbSession.queue[verbSession.pos]);
}

      ${res ? hint('auxOk', item.aux==='optional' ? 'hebben or zijn (both accepted)' : item.aux) : ''}
    </div>

    <div class="vfield ${fieldClass('partOk')}">
      <label>Perfect tense &mdash; participle</label>
      <input type="text" id="inpPart" autocomplete="off" ${res?'disabled':''} value="${escapeHtml(partVal)}" placeholder="voltooid deelwoord...">
      ${hint('partOk', item.participle)}
    </div>

    ${!res ? `<button class="primary" id="btnVerbCheck">Check answer</button>`
           : `<button class="primary" id="btnVerbNext">Next</button>`}
  </div>
  <div class="verb-score">Correct so far: ${s.correctCount} / ${s.pos}</div>
  <div class="exitbar"><a id="btnVerbExit">End session</a></div>
  `;
}

function checkVerbAnswer(){
  const item = currentVerbItem();
  if (!item || verbSession.result) return;
  const pastInput = (document.getElementById('inpPast')||{}).value || '';
  const partInput = (document.getElementById('inpPart')||{}).value || '';
  const chosenAux = verbSession.chosenAux;

  const pastOk = answerMatches(pastInput, item.past_singular) ||
                 (item.past_plural && answerMatches(pastInput, item.past_plural));
  const auxOk = chosenAux && (chosenAux === item.aux || item.aux === 'optional');
  const partOk = answerMatches(partInput, item.participle);

  const allOk = pastOk && auxOk && partOk;
  const correctCount = [pastOk, auxOk, partOk].filter(Boolean).length;

  verbSession.result = { pastOk, auxOk, partOk, pastInput, partInput };

  const card = getVerbCard(item.id);
  card.reps += 1;
  if (correctCount === 3){
    card.box = Math.min(BOX_DAYS.length-1, card.box + 1);
    verbSession.correctCount += 1;
  } else if (correctCount >= 1){
    card.box = Math.max(0, card.box - 1);
  } else {
    card.box = 0;
    card.lapses += 1;
    verbSession.again += 1;
  }
  card.due = Date.now() + BOX_DAYS[card.box]*DAY_MS;
  saveVerbSRS();

  if (!allOk){
    const insertAt = Math.min(verbSession.queue.length, verbSession.pos + 4);
    verbSession.queue.splice(insertAt, 0, item.id);
    verbSession.total = verbSession.queue.length;
  }
  render();
}

function nextVerbItem(){
  verbSession.pos += 1;
  verbSession.result = null;
  verbSession.chosenAux = null;
  verbSession.pastDraft = '';
  verbSession.partDraft = '';
  if (verbSession.pos >= verbSession.queue.length){ view = 'verbsummary'; }
  render();
}

function renderVerbSummary(){
  const s = verbSession;
  return `
  <h1>Drill complete \uD83C\uDF89</h1>
  <div class="panel">
    <div class="statrow">
      <div class="stat"><div class="n">${s? s.total:0}</div><div class="l">Reviewed</div></div>
      <div class="stat"><div class="n">${s? s.correctCount:0}</div><div class="l">Fully correct</div></div>
      <div class="stat"><div class="n">${s? s.again:0}</div><div class="l">Missed</div></div>
    </div>
    <button class="primary" id="btnVerbHome">Back to verb drill home</button>
    <button class="secondary" id="btnVerbAgain">Drill again</button>
  </div>
  `;
}

// ---- export / import ----
function buildExportPayload(){
  return JSON.stringify({ type:'dutchVocabProgress', version:2, exportedAt:new Date().toISOString(), srs, prefs });
}
function downloadExportFile(){
  const blob = new Blob([buildExportPayload()], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'dutch-vocab-progress.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showSyncMsg('exportMsg', 'Downloaded.', false);
}
function copyExportCode(){
  const box = document.getElementById('exportBox');
  box.style.display = 'block';
  box.value = buildExportPayload();
  box.select();
  let ok = false;
  try { ok = document.execCommand('copy'); } catch(e) {}
  if (!ok && navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(box.value).then(()=>showSyncMsg('exportMsg','Copied to clipboard.',false));
  } else {
    showSyncMsg('exportMsg', ok ? 'Copied to clipboard.' : 'Select the text above and copy it manually.', !ok);
  }
}
function showSyncMsg(id, msg, isErr){
  const el = document.getElementById(id);
  if (!el) return;
  el.textContent = msg;
  el.className = 'sync-msg ' + (isErr ? 'err' : 'ok');
}
function applyImportPayload(text){
  let data;
  try { data = JSON.parse(text); } catch(e){ showSyncMsg('importMsg','That does not look like valid progress data.', true); return; }
  if (!data || typeof data.srs !== 'object'){ showSyncMsg('importMsg','Missing progress data in that file.', true); return; }
  const count = Object.keys(data.srs).length;
  const proceed = confirm('Import progress for ' + count + ' words? This will replace your current progress on this device.');
  if (!proceed) return;
  srs = data.srs || {};
  if (data.prefs) prefs = Object.assign(prefs, data.prefs);
  saveSRS(); savePrefs();
  showSyncMsg('importMsg', 'Imported! Reloading view...', false);
  setTimeout(()=>{ view='home'; render(); }, 700);
}

// ---- event handlers ----
function attachHandlers(){
  const app = document.getElementById('app');

  app.querySelectorAll('[data-level]').forEach(el => {
    el.onclick = () => {
      const lv = el.getAttribute('data-level');
      let cur = prefs.levels ? prefs.levels.slice() : LEVELS_PRESENT.slice();
      if (cur.includes(lv)) cur = cur.filter(x=>x!==lv); else cur.push(lv);
      prefs.levels = cur.length === LEVELS_PRESENT.length ? null : cur;
      savePrefs(); render();
    };
  });
  const btnLevelsAll = app.querySelector('[data-action="levels-all"]');
  if (btnLevelsAll) btnLevelsAll.onclick = () => { prefs.levels = null; savePrefs(); render(); };
  const btnLevelsNone = app.querySelector('[data-action="levels-none"]');
  if (btnLevelsNone) btnLevelsNone.onclick = () => { prefs.levels = []; savePrefs(); render(); };

  app.querySelectorAll('[data-chapkey]').forEach(el => {
    el.onclick = () => {
      const key = el.getAttribute('data-chapkey');
      const allKeys = activeLevels().flatMap(lv => CHAPTERS_BY_LEVEL[lv].map(([num])=>chapKey(lv,num)));
      let cur = prefs.chapters ? prefs.chapters.slice() : allKeys.slice();
      if (cur.includes(key)) cur = cur.filter(x=>x!==key); else cur.push(key);
      prefs.chapters = cur;
      savePrefs(); render();
    };
  });
  const btnChapAll = app.querySelector('[data-action="chapters-all"]');
  if (btnChapAll) btnChapAll.onclick = () => { prefs.chapters = null; savePrefs(); render(); };
  const btnChapNone = app.querySelector('[data-action="chapters-none"]');
  if (btnChapNone) btnChapNone.onclick = () => { prefs.chapters = []; savePrefs(); render(); };

  app.querySelectorAll('[data-cat]').forEach(el => {
    el.onclick = () => {
      const cat = el.getAttribute('data-cat');
      let cur = prefs.categories ? prefs.categories.slice() : CATEGORIES.slice();
      if (cur.includes(cat)) cur = cur.filter(x=>x!==cat); else cur.push(cat);
      prefs.categories = cur.length === CATEGORIES.length ? null : cur;
      savePrefs(); render();
    };
  });
  const btnCatsAll = app.querySelector('[data-action="cats-all"]');
  if (btnCatsAll) btnCatsAll.onclick = () => { prefs.categories = null; savePrefs(); render(); };
  const btnCatsNone = app.querySelector('[data-action="cats-none"]');
  if (btnCatsNone) btnCatsNone.onclick = () => { prefs.categories = []; savePrefs(); render(); };

  const chkOpt = document.getElementById('chkOptional');
  if (chkOpt) chkOpt.onchange = () => { prefs.includeOptional = chkOpt.checked; savePrefs(); render(); };

  const selDir = document.getElementById('selDirection');
  if (selDir) selDir.onchange = () => { prefs.direction = selDir.value; savePrefs(); };
  const inpSize = document.getElementById('inpSize');
  if (inpSize) inpSize.onchange = () => { prefs.sessionSize = Math.max(5, Math.min(200, parseInt(inpSize.value)||30)); savePrefs(); };

  const btnStart = document.getElementById('btnStart');
  if (btnStart) btnStart.onclick = startSession;
  const btnBrowse = document.getElementById('btnBrowse');
  if (btnBrowse) btnBrowse.onclick = () => { view='browse'; browseState.search=''; render(); };
  const btnBack = document.getElementById('btnBack');
  if (btnBack) btnBack.onclick = () => { view='home'; render(); };
  const browseSearch = document.getElementById('browseSearch');
  if (browseSearch) {
    browseSearch.oninput = () => { browseState.search = browseSearch.value; render();
      const el2 = document.getElementById('browseSearch'); if (el2){ el2.focus(); el2.selectionStart = el2.selectionEnd = el2.value.length; } };
  }

  const flashcard = document.getElementById('flashcard');
  if (flashcard) flashcard.onclick = () => { session.showBack = true; render(); };
  app.querySelectorAll('[data-grade]').forEach(el => {
    el.onclick = (e) => { e.stopPropagation(); grade(parseInt(el.getAttribute('data-grade'))); };
  });
  const btnExit = document.getElementById('btnExit');
  if (btnExit) btnExit.onclick = () => { view='summary'; render(); };

  const btnHome = document.getElementById('btnHome');
  if (btnHome) btnHome.onclick = () => { view='home'; session=null; render(); };
  const btnStudyAgain = document.getElementById('btnStudyAgain');
  if (btnStudyAgain) btnStudyAgain.onclick = () => { startSession(); };

  const btnExportFile = document.getElementById('btnExportFile');
  if (btnExportFile) btnExportFile.onclick = downloadExportFile;
  const btnExportCopy = document.getElementById('btnExportCopy');
  if (btnExportCopy) btnExportCopy.onclick = copyExportCode;
  const btnImportText = document.getElementById('btnImportText');
  if (btnImportText) btnImportText.onclick = () => {
    const val = document.getElementById('importBox').value.trim();
    if (!val){ showSyncMsg('importMsg','Paste an exported code first.', true); return; }
    applyImportPayload(val);
  };
  const importFile = document.getElementById('importFile');
  if (importFile) importFile.onchange = () => {
    const file = importFile.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => applyImportPayload(reader.result);
    reader.readAsText(file);
  };

  // ---- verb drill handlers ----
  const btnVerbDrill = document.getElementById('btnVerbDrill');
  if (btnVerbDrill) btnVerbDrill.onclick = () => { view = 'verbhome'; render(); };

  app.querySelectorAll('[data-vlevel]').forEach(el => {
    el.onclick = () => {
      const lv = el.getAttribute('data-vlevel');
      let cur = verbPrefs.levels ? verbPrefs.levels.slice() : VERB_LEVELS_PRESENT.slice();
      if (cur.includes(lv)) cur = cur.filter(x=>x!==lv); else cur.push(lv);
      verbPrefs.levels = cur.length === VERB_LEVELS_PRESENT.length ? null : cur;
      saveVerbPrefs(); render();
    };
  });
  const btnVLevelsAll = app.querySelector('[data-action="vlevels-all"]');
  if (btnVLevelsAll) btnVLevelsAll.onclick = () => { verbPrefs.levels = null; saveVerbPrefs(); render(); };
  const btnVLevelsNone = app.querySelector('[data-action="vlevels-none"]');
  if (btnVLevelsNone) btnVLevelsNone.onclick = () => { verbPrefs.levels = []; saveVerbPrefs(); render(); };

  app.querySelectorAll('[data-vchapkey]').forEach(el => {
    el.onclick = () => {
      const key = el.getAttribute('data-vchapkey');
      const allKeys = activeVerbLevels().flatMap(lv => VERB_CHAPTERS_BY_LEVEL[lv].map(([num])=>chapKey(lv,num)));
      let cur = verbPrefs.chapters ? verbPrefs.chapters.slice() : allKeys.slice();
      if (cur.includes(key)) cur = cur.filter(x=>x!==key); else cur.push(key);
      verbPrefs.chapters = cur;
      saveVerbPrefs(); render();
    };
  });
  const btnVChapAll = app.querySelector('[data-action="vchapters-all"]');
  if (btnVChapAll) btnVChapAll.onclick = () => { verbPrefs.chapters = null; saveVerbPrefs(); render(); };
  const btnVChapNone = app.querySelector('[data-action="vchapters-none"]');
  if (btnVChapNone) btnVChapNone.onclick = () => { verbPrefs.chapters = []; saveVerbPrefs(); render(); };

  const chkVerbOpt = document.getElementById('chkVerbOptional');
  if (chkVerbOpt) chkVerbOpt.onchange = () => { verbPrefs.includeOptional = chkVerbOpt.checked; saveVerbPrefs(); render(); };

  const inpVerbSize = document.getElementById('inpVerbSize');
  if (inpVerbSize) inpVerbSize.onchange = () => { verbPrefs.sessionSize = Math.max(5, Math.min(100, parseInt(inpVerbSize.value)||15)); saveVerbPrefs(); };

  const btnVerbStart = document.getElementById('btnVerbStart');
  if (btnVerbStart) btnVerbStart.onclick = startVerbSession;

  const inpPast = document.getElementById('inpPast');
  if (inpPast) inpPast.oninput = () => { if (verbSession) verbSession.pastDraft = inpPast.value; };
  const inpPart = document.getElementById('inpPart');
  if (inpPart) inpPart.oninput = () => { if (verbSession) verbSession.partDraft = inpPart.value; };

  app.querySelectorAll('[data-aux]').forEach(el => {
    el.onclick = () => {
      if (verbSession && verbSession.result) return;
      verbSession.chosenAux = el.getAttribute('data-aux');
      render();
    };
  });

  const btnVerbCheck = document.getElementById('btnVerbCheck');
  if (btnVerbCheck) btnVerbCheck.onclick = checkVerbAnswer;
  const btnVerbNext = document.getElementById('btnVerbNext');
  if (btnVerbNext) btnVerbNext.onclick = nextVerbItem;
  const btnVerbExit = document.getElementById('btnVerbExit');
  if (btnVerbExit) btnVerbExit.onclick = () => { view = 'verbsummary'; render(); };
  const btnVerbHome = document.getElementById('btnVerbHome');
  if (btnVerbHome) btnVerbHome.onclick = () => { view = 'verbhome'; verbSession = null; render(); };
  const btnVerbAgain = document.getElementById('btnVerbAgain');
  if (btnVerbAgain) btnVerbAgain.onclick = () => { startVerbSession(); };
}

render();
</script>
