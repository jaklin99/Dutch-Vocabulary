<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dutch Vocabulary Trainer — A1/A2/B1</title>
<style>
  :root{
    --bg:#0f1720; --panel:#17212b; --panel2:#1e2a36; --border:#2b3947;
    --text:#eaf0f5; --muted:#93a4b3; --accent:#4fb0ff; --accent2:#2f8fd9;
    --green:#3ecf8e; --orange:#ffa94d; --red:#ff5d5d; --blue:#4fb0ff; --yellow:#ffd93d;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:linear-gradient(160deg,#0f1720,#131c26 60%,#0f1720); color:var(--text); min-height:100vh;
  }
  .wrap{max-width:920px;margin:0 auto;padding:24px 16px 60px;}
  header.top{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:18px;}
  header.top h1{font-size:20px;margin:0;font-weight:700;letter-spacing:.2px;}
  header.top h1 span{color:var(--accent);}
  .navbtn{background:var(--panel2);border:1px solid var(--border);color:var(--text);padding:8px 14px;border-radius:8px;cursor:pointer;font-size:13px;}
  .navbtn:hover{border-color:var(--accent);}
  .stats-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px;}
  .stat{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:10px 14px;min-width:88px;text-align:center;flex:1;}
  .stat .num{font-size:20px;font-weight:700;}
  .stat .lbl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin-top:2px;}
  .stat.new .num{color:var(--blue);} .stat.learning .num{color:var(--orange);} .stat.due .num{color:var(--red);} .stat.mastered .num{color:var(--green);}
  .panel{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:20px;margin-bottom:16px;}
  .panel h2{margin:0 0 12px;font-size:15px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;}
  .chip-grid{display:flex;flex-wrap:wrap;gap:8px;}
  .chip{background:var(--panel2);border:1px solid var(--border);border-radius:20px;padding:7px 13px;font-size:13px;cursor:pointer;user-select:none;display:flex;align-items:center;gap:6px;}
  .chip .checkmark{font-size:14px;}
  .chip.on{background:rgba(79,176,255,.18);border-color:var(--accent);color:var(--accent);}
  .chip .count{color:var(--muted);font-size:11px;}
  .chip.on .count{color:var(--accent);}
  .row-controls{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
  .link-btn{background:none;border:none;color:var(--accent);font-size:12px;cursor:pointer;padding:0;}
  .seg{display:inline-flex;background:var(--panel2);border:1px solid var(--border);border-radius:10px;overflow:hidden;}
  .seg button{background:none;border:none;color:var(--muted);padding:9px 16px;font-size:13px;cursor:pointer;}
  .seg button.active{background:var(--accent);color:#0b1620;font-weight:600;}
  select{background:var(--panel2);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:9px 12px;font-size:13px;}
  .startbar{display:flex;flex-wrap:wrap;gap:14px;align-items:center;margin-top:16px;}
  .bigbtn{background:linear-gradient(135deg,var(--accent),var(--accent2));border:none;color:#06121c;font-weight:700;padding:14px 28px;border-radius:12px;font-size:15px;cursor:pointer;box-shadow:0 6px 20px rgba(79,176,255,.25);}
  .bigbtn:hover{filter:brightness(1.08);}
  .bigbtn:disabled{opacity:.4;cursor:not-allowed;filter:none;box-shadow:none;}
  .ghostbtn{background:none;border:1px solid var(--border);color:var(--text);padding:13px 20px;border-radius:12px;font-size:14px;cursor:pointer;}
  .ghostbtn:hover{border-color:var(--accent);}

  /* Study view */
  .study-wrap{display:flex;flex-direction:column;align-items:center;padding-top:10px;}
  .progressbar{width:100%;max-width:560px;height:6px;background:var(--panel2);border-radius:4px;overflow:hidden;margin-bottom:26px;}
  .progressbar .fill{height:100%;background:var(--accent);transition:width .25s;}
  .card{width:100%;max-width:560px;min-height:280px;background:var(--panel);border:1px solid var(--border);border-radius:20px;padding:36px 30px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;cursor:pointer;position:relative;}
  .card .tags{position:absolute;top:16px;left:16px;right:16px;display:flex;justify-content:space-between;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;}
  .card .direction-tag{background:var(--panel2);padding:4px 10px;border-radius:6px;}
  .card .front{font-size:30px;font-weight:700;line-height:1.3;}
  .card .article{color:var(--accent);font-weight:500;font-size:20px;margin-right:8px;}
  .card .hint{margin-top:18px;color:var(--muted);font-size:13px;}
  .card .back{margin-top:22px;padding-top:22px;border-top:1px dashed var(--border);width:100%;}
  .card .translation{font-size:24px;font-weight:700;color:var(--green);}
  .card .forms{margin-top:12px;font-size:15px;color:var(--muted);}
  .card .forms b{color:var(--text);}
  .grade-row{display:flex;gap:10px;margin-top:22px;width:100%;max-width:560px;}
  .grade-row button{flex:1;padding:14px 8px;border-radius:12px;border:none;font-weight:700;font-size:14px;cursor:pointer;color:#0b1620;display:flex;flex-direction:column;gap:2px;}
  .grade-row button small{font-weight:500;font-size:10px;opacity:.75;}
  .g-again{background:var(--red);} .g-hard{background:var(--orange);} .g-good{background:var(--green);} .g-easy{background:var(--blue);}
  .flip-hint{color:var(--muted);font-size:13px;margin-top:20px;}
  .kbd{background:var(--panel2);border:1px solid var(--border);border-radius:5px;padding:1px 6px;font-size:11px;}

  /* Summary */
  .summary{text-align:center;padding:40px 20px;}
  .summary h2{font-size:26px;margin-bottom:6px;}
  .summary p{color:var(--muted);}
  .summary-stats{display:flex;justify-content:center;gap:24px;margin:26px 0;}
  .summary-stats div{text-align:center;}
  .summary-stats .n{font-size:28px;font-weight:700;}

  /* Browse */
  .browse-controls{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;}
  .browse-controls input[type=text]{flex:1;min-width:180px;background:var(--panel2);border:1px solid var(--border);color:var(--text);padding:10px 14px;border-radius:8px;font-size:14px;}
  table{width:100%;border-collapse:collapse;font-size:14px;}
  th{text-align:left;color:var(--muted);font-size:11px;text-transform:uppercase;padding:8px 10px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--panel);}
  td{padding:9px 10px;border-bottom:1px solid rgba(43,57,71,.5);}
  tr:hover td{background:rgba(255,255,255,.02);}
  .cat-tag{font-size:10px;padding:2px 7px;border-radius:5px;background:var(--panel2);color:var(--muted);white-space:nowrap;}
  .browse-scroll{max-height:65vh;overflow:auto;border:1px solid var(--border);border-radius:10px;}
  .empty-msg{text-align:center;color:var(--muted);padding:40px;}
  .footer-note{text-align:center;color:var(--muted);font-size:12px;margin-top:30px;}
  .sync-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px;}
  .sync-row textarea{width:100%;min-height:70px;background:var(--panel2);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:10px;font-size:11px;font-family:monospace;resize:vertical;}
  .smallbtn{background:var(--panel2);border:1px solid var(--border);color:var(--text);padding:8px 14px;border-radius:8px;font-size:12px;cursor:pointer;white-space:nowrap;}
  .smallbtn:hover{border-color:var(--accent);}
  .sync-msg{font-size:12px;color:var(--green);margin-top:6px;min-height:16px;}
  .sync-msg.err{color:var(--red);}
  details.sync-details summary{cursor:pointer;color:var(--accent);font-size:13px;list-style:none;}
  details.sync-details summary::-webkit-details-marker{display:none;}
  details.sync-details[open] summary{margin-bottom:12px;}

  /* Speaking practice */
  .speak-textarea{width:100%;min-height:80px;background:var(--panel2);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:10px;font-size:14px;font-family:inherit;resize:vertical;margin-top:14px;}
  .speak-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px;width:100%;justify-content:center;align-items:center;}
  .speak-prompt{font-size:17px;line-height:1.5;margin-top:6px;}
  .speak-gloss{color:var(--muted);font-size:13px;margin-top:6px;}
  .speak-reveal{margin-top:18px;padding-top:18px;border-top:1px dashed var(--border);width:100%;font-size:15px;color:var(--green);}
  .hint-chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;align-items:center;margin:14px 0;}
  .hint-chip{background:var(--panel2);border:1px solid var(--border);border-radius:20px;padding:6px 12px;font-size:13px;}
  .hint-chip.used{border-color:var(--green);color:var(--green);}
  /* Levels & optional words */
  .level-group{margin-bottom:14px;}
  .level-group:last-child{margin-bottom:0;}
  .level-group-title{font-size:11px;color:var(--accent);font-weight:700;letter-spacing:.6px;text-transform:uppercase;margin:0 0 8px;}
  .toggle-row{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text);cursor:pointer;margin-top:14px;}
  .toggle-row .count{color:var(--muted);font-size:12px;}
  .opt-badge{display:inline-block;background:#3a2a1a;color:#f0c98a;border-radius:6px;padding:1px 6px;font-size:10px;margin-left:6px;vertical-align:middle;}
  .empty-state{color:var(--muted);font-size:13px;padding:4px 0;}
  @media (max-width:560px){
    .card .front{font-size:24px;} .card .translation{font-size:19px;}
    .grade-row button{font-size:12px;padding:12px 4px;}
    .summary-stats{gap:14px;}
  }
</style>
</head>

function fillTemplate(tpl, w){
  const art = w.article ? w.article+' ' : '';
  return tpl.replace(/\{art\}/g, art).replace(/\{w\}/g, w.dutch);
}

let nlVoice = null;
function pickDutchVoice(){
  if(!('speechSynthesis' in window)) return null;
  const voices = speechSynthesis.getVoices();
  return voices.find(v=>v.lang && v.lang.toLowerCase().startsWith('nl')) || null;
}
if('speechSynthesis' in window){
  nlVoice = pickDutchVoice();
  speechSynthesis.onvoiceschanged = ()=>{ nlVoice = pickDutchVoice(); };
}
function speakDutch(text){
  if(!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'nl-NL';
  u.rate = 0.9;
  if(nlVoice) u.voice = nlVoice;
  speechSynthesis.speak(u);
}
let storageWorks = true;
function safeGet(key){
  try{ return localStorage.getItem(key); }catch(e){ storageWorks=false; return null; }
}
function safeSet(key,val){
  try{ localStorage.setItem(key,val); }catch(e){ storageWorks=false; }
}

let srs = {};
try{ srs = JSON.parse(safeGet(STORAGE_KEY)) || {}; }catch(e){ srs = {}; }
function saveSRS(){ safeSet(STORAGE_KEY, JSON.stringify(srs)); }

let prefs = { levels: null, chapters: null, categories: null, includeOptional: true, direction: 'mixed', sessionSize: 30, reviewMode: 'due', speakTypes: ['pronounce','sentence','roleplay'] };
let migratedFromV1 = false;
try{
  const p = JSON.parse(safeGet(PREFS_KEY));
  if(p){
    prefs = Object.assign(prefs,p);
  } else {
    // Before the A1/A2 chapters were added, chapters were plain numbers and everything was A2-B1.
    const old = JSON.parse(safeGet(PREFS_KEY_V1));
    if(old){ prefs = Object.assign(prefs, old); migratedFromV1 = true; }
  }
}catch(e){}
function savePrefs(){ safeSet(PREFS_KEY, JSON.stringify(prefs)); }

function getCard(id){
  if(!srs[id]) srs[id] = { box:0, due:0, reps:0, lapses:0 };
  return srs[id];
}
function isNew(id){ return !srs[id] || srs[id].reps===0 && srs[id].box===0 && srs[id].due===0; }
function isDue(id){
  const c = srs[id];
  if(!c) return true;
  if(isNew(id)) return true;
  return c.due <= Date.now();
}
function isMastered(id){ const c=srs[id]; return c && c.box>=5; }
function isLearning(id){ const c=srs[id]; return c && c.reps>0 && c.box>=1 && c.box<5; }

// Chapter numbers restart per level, so a chapter is identified by level + number.
function chapKey(level, num){ return level + '|' + num; }

const LEVELS_PRESENT = LEVEL_ORDER.filter(lv => WORDS.some(w=>w.level===lv));
const CHAPTERS_BY_LEVEL = {};
LEVELS_PRESENT.forEach(lv=>{
  const map = new Map();
  WORDS.filter(w=>w.level===lv).forEach(w=>{ if(!map.has(w.chapter)) map.set(w.chapter, w.chapter_title); });
  CHAPTERS_BY_LEVEL[lv] = [...map.entries()].sort((a,b)=>a[0]-b[0]);
});
const ALL_CHAP_KEYS = [];
LEVELS_PRESENT.forEach(lv => CHAPTERS_BY_LEVEL[lv].forEach(([num]) => ALL_CHAP_KEYS.push(chapKey(lv,num))));
const CATEGORIES = Object.keys(CAT_LABELS).filter(c => WORDS.some(w=>w.category===c));

if(migratedFromV1){
  // Keep the old A2-B1 chapter selection, pre-select every new chapter, but leave the
  // learner on A2-B1 only so their session size doesn't suddenly double.
  const keptA2B1 = Array.isArray(prefs.chapters) ? prefs.chapters.map(n=>chapKey('A2-B1', n)) : null;
  prefs.chapters = keptA2B1
    ? ALL_CHAP_KEYS.filter(k => k.indexOf('A2-B1|')!==0 || keptA2B1.includes(k))
    : ALL_CHAP_KEYS.slice();
  prefs.levels = ['A2-B1'];
}
if(prefs.levels===null) prefs.levels = LEVELS_PRESENT.slice();
if(prefs.chapters===null) prefs.chapters = ALL_CHAP_KEYS.slice();
if(prefs.categories===null) prefs.categories = CATEGORIES.slice();
// Drop anything left over from an older word list. An empty selection is a valid
// choice, so only fall back to "everything" when the stored values were all unknown.
function pruneSelection(stored, valid){
  const kept = (Array.isArray(stored) ? stored : []).filter(v => valid.includes(v));
  if(kept.length===0 && Array.isArray(stored) && stored.length>0) return valid.slice();
  return kept;
}
prefs.levels = pruneSelection(prefs.levels, LEVELS_PRESENT);
prefs.chapters = pruneSelection(prefs.chapters, ALL_CHAP_KEYS);
prefs.categories = pruneSelection(prefs.categories, CATEGORIES);
if(migratedFromV1) savePrefs();

let session = null; // {queue:[...ids], idx, direction, results:{again,hard,good,easy}, total}
let view = 'home';

function inSelection(w){
  return prefs.levels.includes(w.level)
    && prefs.chapters.includes(chapKey(w.level, w.chapter))
    && prefs.categories.includes(w.category);
}
function filteredWords(){
  return WORDS.filter(w => inSelection(w) && (prefs.includeOptional || !w.optional));
}
function wordTag(w){
  return `${LEVEL_LABELS[w.level]||''} · H${w.chapter} · ${CAT_LABELS[w.category]}`;
}

function renderTopStats(){
  const fw = filteredWords();
  const total = fw.length;
  const newC = fw.filter(w=>isNew(w.id)).length;
  const dueC = fw.filter(w=>!isNew(w.id) && isDue(w.id)).length;
  const learnC = fw.filter(w=>isLearning(w.id)).length;
  const mastC = fw.filter(w=>isMastered(w.id)).length;
  return `<div class="stats-row">
    <div class="stat new"><div class="num">${newC}</div><div class="lbl">New</div></div>

}

function pickDirection(word){
  if(prefs.direction==='nl-en') return 'nl-en';
  if(prefs.direction==='en-nl') return 'en-nl';
  return Math.random()<0.5 ? 'nl-en' : 'en-nl';
}

function buildQueue(){
  let fw = filteredWords();
  let pool;
  if(prefs.reviewMode==='all'){
    pool = fw.slice();
    shuffle(pool);
  } else {
    const dueWords = fw.filter(w=>!isNew(w.id) && isDue(w.id));
    const newWords = fw.filter(w=>isNew(w.id));
    shuffle(dueWords); shuffle(newWords);
    pool = dueWords.concat(newWords);
  }
  const size = prefs.sessionSize;
  if(size!==999) pool = pool.slice(0, size);
  return pool.map(w=>({ id:w.id, dir: pickDirection(w) }));
}
function shuffle(arr){ for(let i=arr.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]]; } }

function startSession(){
  const queue = buildQueue();
  session = { queue, pos:0, revealed:false, results:{again:0,hard:0,good:0,easy:0}, seenTotal: queue.length };
  view='study';
  render();
}

function currentItem(){
  if(!session) return null;
  if(session.pos >= session.queue.length) return null;
  return session.queue[session.pos];
}

function renderStudy(){
  const item = currentItem();
  if(!item){ view='summary'; return renderSummary(); }
  const w = WORDS.find(x=>x.id===item.id);
  const pct = Math.round((session.pos/session.seenTotal)*100);
  const nlFront = (w.article? `<span class="article">${w.article}</span>`:'') + escapeHtml(w.dutch);
  const front = item.dir==='nl-en' ? nlFront : escapeHtml(w.english);
  const back = item.dir==='nl-en' ? escapeHtml(w.english) : nlFront;
  let formsHtml = '';
  if(w.forms) formsHtml = `<div class="forms"><b>Forms:</b> ${escapeHtml(w.forms)}</div>`;
  const backBlock = session.revealed ? `
    <div class="back">
      <div class="translation">${back}</div>
      ${formsHtml}
    </div>` : '';
  const gradeRow = session.revealed ? `
    <div class="grade-row">
      <button class="g-again" data-grade="again">Again<small>forgot</small></button>
      <button class="g-hard" data-grade="hard">Hard<small>tough recall</small></button>

  return `

    <button class="navbtn" data-nav="home">✕ End session</button>

      <div class="front">${front}</div>

function grade(g){
  const item = currentItem();
  if(!item) return;
  const c = getCard(item.id);
  session.results[g]++;
  if(g==='again'){
    c.lapses++;
    c.box = 0;
    c.due = Date.now();
    session.queue.push({ id:item.id, dir: pickDirection(WORDS.find(w=>w.id===item.id)) });
    session.seenTotal++;
  } else {
    c.reps++;
    if(g==='hard') c.box = Math.max(1, c.box);
    else if(g==='good') c.box = Math.min(BOX_DAYS.length-1, c.box+1);
    else if(g==='easy') c.box = Math.min(BOX_DAYS.length-1, c.box+2);
    const days = BOX_DAYS[c.box];
    c.due = Date.now() + days*24*60*60*1000;
  }
  saveSRS();
  session.pos++;
  session.revealed = false;
  render();
}

// ---- Speaking practice session ----
let speakSession = null; // {queue, pos, seenTotal, revealed, counts}

function pickTemplate(w){
  const list = SENTENCE_TEMPLATES[w.category];
  if(!list) return null;
  return list[Math.floor(Math.random()*list.length)];
}

function buildSpeakQueue(){
  let fw = filteredWords();
  shuffle(fw);
  const size = prefs.sessionSize===999 ? fw.length : Math.min(prefs.sessionSize, fw.length);
  fw = fw.slice(0, Math.max(size,1));
  const types = prefs.speakTypes.length ? prefs.speakTypes : ['pronounce'];
  const wantPronounce = types.includes('pronounce');
  const wantSentence = types.includes('sentence');
  const wantRoleplay = types.includes('roleplay');

  // Roleplay-only: build a pure conversation-practice session, not tied 1:1 to words.
  if(wantRoleplay && !wantPronounce && !wantSentence){
    const scenarios = SCENARIOS.slice();
    shuffle(scenarios);
    const count = prefs.sessionSize===999 ? SCENARIOS.length : Math.min(size, SCENARIOS.length*3);
    const queue = [];
    for(let i=0;i<count;i++){
      const scenario = scenarios[i % scenarios.length];
      const others = fw.slice();
      shuffle(others);
      const hintIds = others.slice(0,2).map(x=>x.id);
      queue.push({ type:'roleplay', scenario, hintIds });
    }
    return queue;
  }

  const wordTypes = [];
  if(wantPronounce) wordTypes.push('pronounce');
  if(wantSentence) wordTypes.push('sentence');
  if(!wordTypes.length) wordTypes.push('pronounce');

  const queue = [];
  fw.forEach((w,i)=>{
    const type = wordTypes[i % wordTypes.length];
    const item = { type, id:w.id };
    if(type==='sentence') item.template = pickTemplate(w);
    queue.push(item);
    if(wantRoleplay && (i+1)%4===0 && fw.length>1){
      const others = fw.filter(x=>x.id!==w.id);
      shuffle(others);
      const hintIds = others.slice(0,2).map(x=>x.id);
      const scenario = SCENARIOS[Math.floor(Math.random()*SCENARIOS.length)];
      queue.push({ type:'roleplay', scenario, hintIds });
    }
  });
  return queue;
}

function startSpeakSession(){
  const queue = buildSpeakQueue();
  speakSession = { queue, pos:0, seenTotal:queue.length, revealed:false, counts:{pronounce:0,sentence:0,roleplay:0} };
  view='speak';
  render();
}

function currentSpeakItem(){
  if(!speakSession) return null;
  if(speakSession.pos >= speakSession.queue.length) return null;
  return speakSession.queue[speakSession.pos];
}

function nextSpeakItem(){
  const item = currentSpeakItem();
  if(item) speakSession.counts[item.type]++;
  speakSession.pos++;
  speakSession.revealed = false;
  render();
}

function renderSpeak(){

  if(!item){ view='speakSummary'; return renderSpeakSummary(); }

function escapeHtml(s){

}

// ---- Progress export / import (manual sync between devices) ----
function buildExportPayload(){
  return JSON.stringify({ type:'dutchVocabProgress', version:1, exportedAt:new Date().toISOString(), srs, prefs });
}
function downloadExportFile(){
  const payload = buildExportPayload();
  const blob = new Blob([payload], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const stamp = new Date().toISOString().slice(0,10);
  a.href = url; a.download = `dutch-vocab-progress-${stamp}.json`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
}
function copyExportCode(){
  const payload = buildExportPayload();
  const box = document.getElementById('exportBox');
  box.value = payload;
  box.style.display = 'block';
  box.focus(); box.select();
  let copied = false;
  try{ document.execCommand('copy'); copied = true; }catch(e){}
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(payload).then(()=>{ showSyncMsg('exportMsg', 'Copied to clipboard! Paste it on your other device.', false); })
      .catch(()=>{ showSyncMsg('exportMsg', copied ? 'Copied to clipboard!' : 'Could not auto-copy — the code is selected above, press Ctrl/Cmd+C to copy manually.', !copied); });
  } else {
    showSyncMsg('exportMsg', copied ? 'Copied to clipboard!' : 'Could not auto-copy — the code is selected above, press Ctrl/Cmd+C to copy manually.', !copied);
  }
}
function showSyncMsg(id, msg, isErr){
  const el = document.getElementById(id);
  if(!el) return;
  el.textContent = msg;
  el.className = 'sync-msg' + (isErr ? ' err' : '');
}
function applyImportPayload(text){
  let data;
  try{ data = JSON.parse(text); }catch(e){ showSyncMsg('importMsg', 'That doesn\'t look like valid progress data (couldn\'t parse it).', true); return; }
  const incomingSrs = data && data.srs ? data.srs : (data && typeof data === 'object' && !data.type ? data : null);
  if(!incomingSrs || typeof incomingSrs !== 'object'){
    showSyncMsg('importMsg', 'That file/code doesn\'t contain recognizable progress data.', true);
    return;
  }
  const count = Object.keys(incomingSrs).length;
  if(!confirm(`Import progress for ${count} word(s)? This will replace the progress currently saved on this device.`)) return;
  srs = incomingSrs;
  saveSRS();
  if(data.prefs){ prefs = Object.assign(prefs, data.prefs); savePrefs(); }
  showSyncMsg('importMsg', `Imported progress for ${count} word(s). Refreshing...`, false);
  setTimeout(()=>{ view='home'; render(); }, 700);
}

function attachHandlers(){
  document.querySelectorAll('[data-nav]').forEach(el=>el.onclick=()=>{ view = el.dataset.nav; session=null; speakSession=null; synAntSession=null; render(); });

  if(view==='home'){
    document.querySelectorAll('.chip[data-level]').forEach(el=>{
      el.onclick = ()=>{
        const lv = el.dataset.level;
        const i = prefs.levels.indexOf(lv);
        if(i>=0) prefs.levels.splice(i,1); else prefs.levels.push(lv);
        savePrefs(); render();
      };
    });
    document.querySelectorAll('.chip[data-chapkey]').forEach(el=>{
      el.onclick = ()=>{
        const key = el.dataset.chapkey;
        const i = prefs.chapters.indexOf(key);
        if(i>=0) prefs.chapters.splice(i,1); else prefs.chapters.push(key);
        savePrefs(); render();
      };
    });
    document.querySelectorAll('.chip[data-cat]').forEach(el=>{
      el.onclick = ()=>{
        const cat = el.dataset.cat;
        const i = prefs.categories.indexOf(cat);
        if(i>=0) prefs.categories.splice(i,1); else prefs.categories.push(cat);
        savePrefs(); render();
      };
    });
    const allLevel = document.querySelectorAll('[data-alllevel]');
    if(allLevel.length) allLevel.forEach(el=>el.onclick=()=>{ prefs.levels = el.dataset.alllevel==='all'? LEVELS_PRESENT.slice() : []; savePrefs(); render(); });
    const allChap = document.querySelectorAll('[data-allchap]');
    if(allChap.length) allChap.forEach(el=>el.onclick=()=>{
      // "Select all" only touches the levels currently on screen.
      const shown = ALL_CHAP_KEYS.filter(k => prefs.levels.includes(k.split('|')[0]));
      prefs.chapters = el.dataset.allchap==='all'
        ? [...new Set(prefs.chapters.concat(shown))]
        : prefs.chapters.filter(k => !shown.includes(k));
      savePrefs(); render();
    });
    const chkOptional = document.getElementById('chkOptional');
    if(chkOptional) chkOptional.onchange = ()=>{ prefs.includeOptional = chkOptional.checked; savePrefs(); render(); };
    const allCat = document.querySelectorAll('[data-allcat]');
    if(allCat.length) allCat.forEach(el=>el.onclick=()=>{ prefs.categories = el.dataset.allcat==='all'? CATEGORIES.slice() : []; savePrefs(); render(); });
    document.querySelectorAll('.chip[data-speaktype]').forEach(el=>{
      el.onclick = ()=>{
        const key = el.dataset.speaktype;
        const i = prefs.speakTypes.indexOf(key);
        if(i>=0) prefs.speakTypes.splice(i,1); else prefs.speakTypes.push(key);
        savePrefs(); render();
      };
    });
    const allSpeak = document.querySelectorAll('[data-allspeak]');
    if(allSpeak.length) allSpeak.forEach(el=>el.onclick=()=>{ prefs.speakTypes = el.dataset.allspeak==='all'? ['pronounce','sentence','roleplay'] : []; savePrefs(); render(); });
    const reviewseg = document.getElementById('reviewseg');
    if(reviewseg) reviewseg.querySelectorAll('button').forEach(b=>b.onclick=()=>{ prefs.reviewMode=b.dataset.review; savePrefs(); render(); });
    const dirseg = document.getElementById('dirseg');
    if(dirseg) dirseg.querySelectorAll('button').forEach(b=>b.onclick=()=>{ prefs.direction=b.dataset.dir; savePrefs(); render(); });
    const sizeSel = document.getElementById('sessionSize');
    if(sizeSel) sizeSel.onchange = ()=>{ prefs.sessionSize = Number(sizeSel.value); savePrefs(); };
    const startBtn = document.getElementById('startBtn');
    if(startBtn) startBtn.onclick = startSession;
    const startSpeakBtn = document.getElementById('startSpeakBtn');
    if(startSpeakBtn) startSpeakBtn.onclick = startSpeakSession;
    const startSynAntBtn = document.getElementById('startSynAntBtn');
    if(startSynAntBtn) startSynAntBtn.onclick = startSynAntSession;

    const btnExportFile = document.getElementById('btnExportFile');
    if(btnExportFile) btnExportFile.onclick = downloadExportFile;
    const btnExportCopy = document.getElementById('btnExportCopy');
    if(btnExportCopy) btnExportCopy.onclick = copyExportCode;
    const importFileEl = document.getElementById('importFile');
    if(importFileEl) importFileEl.onchange = ()=>{
      const file = importFileEl.files[0];
      if(!file) return;
      const reader = new FileReader();
      reader.onload = () => applyImportPayload(reader.result);
      reader.onerror = () => showSyncMsg('importMsg', 'Could not read that file.', true);
      reader.readAsText(file);
    };
    const btnImportText = document.getElementById('btnImportText');
    if(btnImportText) btnImportText.onclick = ()=>{
      const box = document.getElementById('importBox');
      if(!box.value.trim()){ showSyncMsg('importMsg', 'Paste an exported code first.', true); return; }
      applyImportPayload(box.value.trim());
    };
  }

  if(view==='study'){
    const card = document.getElementById('flipCard');
    if(card) card.onclick = ()=>{ if(!session.revealed){ session.revealed=true; render(); } };
    document.querySelectorAll('[data-grade]').forEach(el=>el.onclick=(e)=>{ e.stopPropagation(); grade(el.dataset.grade); });
  }

  if(view==='speak'){
    const item = currentSpeakItem();
    if(item){
      const listenBtn = document.getElementById('listenBtn');
      if(listenBtn) listenBtn.onclick = ()=>{
        if(item.type==='roleplay') speakDutch(item.scenario.dutch);
        else speakDutch(WORDS.find(x=>x.id===item.id).dutch);
      };
      const listenAnswerBtn = document.getElementById('listenAnswerBtn');
      if(listenAnswerBtn) listenAnswerBtn.onclick = ()=> speakDutch(item.scenario.modelAnswer);
      const glossCard = document.getElementById('glossCard');
      if(glossCard) glossCard.onclick = ()=>{ if(!speakSession.revealed){ speakSession.revealed=true; render(); } };
      const revealBtn = document.getElementById('revealBtn');
      if(revealBtn) revealBtn.onclick = ()=>{ speakSession.revealed = true; render(); };
      const nextBtn = document.getElementById('nextBtn');
      if(nextBtn) nextBtn.onclick = nextSpeakItem;
      const roleplayInput = document.getElementById('roleplayInput');
      if(roleplayInput){
        roleplayInput.oninput = ()=>{
          const text = roleplayInput.value.toLowerCase();
          document.querySelectorAll('.hint-chip').forEach(chip=>{
            const hw = chip.dataset.hintword.toLowerCase();
            const stem = hw.slice(0, Math.min(5, hw.length));
            chip.classList.toggle('used', text.includes(stem));
          });
        };
      }
    }
  }

  if(view==='synant'){
    const id = currentSynAntItem();
    if(id!==null){
      const w = WORDS.find(x=>x.id===id);
      const listenBtn = document.getElementById('listenBtn');
      if(listenBtn) listenBtn.onclick = ()=> speakDutch(w.dutch);
      const synantCard = document.getElementById('synantCard');
      if(synantCard) synantCard.onclick = ()=>{ if(!synAntSession.revealed){ synAntSession.revealed=true; render(); } };
      const nextBtn = document.getElementById('nextBtn');
      if(nextBtn) nextBtn.onclick = nextSynAntItem;
    }
  }

  if(view==='browse'){
    const sb = document.getElementById('searchBox');
    if(sb){ sb.oninput = ()=>{ browseState.search = sb.value; render(); setTimeout(()=>{ const el=document.getElementById('searchBox'); if(el){ el.focus(); el.selectionStart=el.selectionEnd=el.value.length; } },0); }; }
    const lvf = document.getElementById('levelFilter'); if(lvf) lvf.onchange = ()=>{ browseState.level = lvf.value; browseState.chapter = 'all'; render(); };
    const cf = document.getElementById('chapFilter'); if(cf) cf.onchange = ()=>{ browseState.chapter = cf.value; render(); };
    const tf = document.getElementById('catFilter'); if(tf) tf.onchange = ()=>{ browseState.category = tf.value; render(); };
  }
}

document.addEventListener('keydown', (e)=>{
  if(view!=='study' || !session) return;
  if(e.code==='Space'){ e.preventDefault(); if(!session.revealed){ session.revealed=true; render(); } return; }
  if(session.revealed){
    if(e.key==='1') grade('again');
    if(e.key==='2') grade('hard');
    if(e.key==='3') grade('good');
    if(e.key==='4') grade('easy');
  }
});

render();
</script>
